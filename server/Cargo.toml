[package]
name = "label-studio-server"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0"

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["fs", "macros", "net", "rt-multi-thread", "signal", "sync"] }
tower-http = { version = "0.6", features = ["fs", "timeout"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
base64 = "0.22"
chrono = "0.4"
chrono-tz = "0.10"
uuid = { version = "1", features = ["v4", "v5", "serde"] }
regex = "1"
tempfile = "3"
sha2 = "0.10"
fs2 = "0.4"
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "blocking"] }
ttf-parser = "0.25"
walkdir = "2"
qrcode = { version = "0.14", default-features = false }
barcoders = { version = "2", default-features = false, features = ["std"] }
freetype-rs = "0.38"
url = "2"
subtle = "2"
rusb = { version = "0.9", features = ["vendored"] }
encoding_rs = "0.8"
