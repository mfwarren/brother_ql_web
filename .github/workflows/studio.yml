name: Label Studio
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.0
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y libfreetype6-dev pkg-config fonts-dejavu-core poppler-utils
      - run: cargo fmt --manifest-path server/Cargo.toml --check
      - run: cargo test --manifest-path server/Cargo.toml --locked
      - run: cargo clippy --manifest-path server/Cargo.toml --all-targets --locked -- -D warnings
      - run: cargo build --manifest-path server/Cargo.toml --locked
      - run: npm install --global npm@11.19.0
      - run: npm ci --prefix frontend
      - run: node --experimental-strip-types frontend/title-checks.mjs
      - run: node --experimental-strip-types frontend/rich-text-checks.mjs
      - run: npm run build --prefix frontend
      - run: python -m pip install Pillow==12.3.0 zxing-cpp==3.1.1
      - name: Exercise real HTTP endpoints in simulation
        shell: bash
        run: |
          set -euo pipefail
          test_data=$(mktemp -d)
          STUDIO_DATA_DIR="$test_data" PRINTER_PRINTER=simulation SERVER_PORT=8016 WEBHOOK_PASSWORD=ci-test server/target/debug/label-studio-server > /tmp/label-studio.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" || true' EXIT
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:8016/studio/api/config > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8016/studio/ > /dev/null
          python tools/check_rust_api.py --url http://127.0.0.1:8016 --require-decode
          python tools/check_webhook.py --url http://127.0.0.1:8016 --password ci-test --data-dir "$test_data"
          python tools/check_http_admission.py --url http://127.0.0.1:8016
