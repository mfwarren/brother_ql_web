name: Label Studio
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core poppler-utils libusb-1.0-0
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest tests/test_studio.py tests/test_studio_qr.py tests/test_printer_settings.py tests/test_studio_samples.py -q
      - run: npm ci --prefix frontend
      - run: npm run build --prefix frontend
